[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ambient-stethoscope-hai"
version = "1.0.0"
description = "Privacy-preserving ambient respiratory monitoring simulator for hospital-acquired infection early warning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "AI Ambient Stethoscope Contributors" }
]
keywords = ["healthcare", "respiratory", "simulation", "fastapi", "streamlit"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Healthcare Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]

dependencies = [
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "joblib>=1.3.0",
  "flask>=2.3.0",
  "fastapi>=0.100.0",
  "uvicorn[standard]>=0.23.0",
  "pydantic>=2.0.0",
  "streamlit>=1.28.0",
  "pandas>=2.0.0",
  "requests>=2.31.0",
  "paho-mqtt>=1.6.0",
  "librosa>=0.10.2",
  "soundfile>=0.12.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "types-requests>=2.31.0.20240218"
]

[tool.setuptools]
packages = [
  "backend",
  "common",
  "dashboard",
  "edge_ml",
  "ehr",
  "sensor_node",
  "sensor_sim",
  "server",
  "shared"
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --cov=backend --cov=edge_ml --cov=sensor_sim --cov=shared --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["backend", "edge_ml", "sensor_sim", "shared", "scripts", "tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = "^(datasets|venv)/"
